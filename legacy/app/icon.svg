<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="orb" cx="38%" cy="36%" r="58%" fx="38%" fy="36%">
      <stop offset="0%"   stop-color="#a7e5d3" stop-opacity="0.97"/>
      <stop offset="40%"  stop-color="#c8b8e0" stop-opacity="0.80"/>
      <stop offset="68%"  stop-color="#a8c8e8" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#a8c8e8" stop-opacity="0.12"/>
    </radialGradient>
    <filter id="f1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="f2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Page-background fill -->
  <circle cx="16" cy="16" r="16" fill="#0c0a09"/>

  <!-- Soft outer glow -->
  <circle cx="16" cy="16" r="14.5" fill="none"
          stroke="#a7e5d3" stroke-width="1.5" stroke-opacity="0.14"
          filter="url(#glow)"/>

  <!-- Main orb sphere -->
  <circle cx="16" cy="16" r="13" fill="url(#orb)"/>

  <!-- Primary specular (large, top-left) -->
  <ellipse cx="12.5" cy="10.5" rx="4.2" ry="2.4"
           fill="white" fill-opacity="0.58" filter="url(#f1)"/>

  <!-- Secondary specular (small, top-right) -->
  <circle cx="21" cy="10.5" r="1.6"
          fill="white" fill-opacity="0.36" filter="url(#f2)"/>

  <!-- Tertiary specular (tiny, bottom-right) -->
  <circle cx="21.5" cy="21.5" r="0.9"
          fill="white" fill-opacity="0.22" filter="url(#f2)"/>
</svg>
