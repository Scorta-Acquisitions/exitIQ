name: Claude Frontend PR Review
on:
  # Triggers only when someone comments @claude on a PR
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  frontend-review:
    runs-on: ubuntu-latest
    # Guard: only run if comment contains @claude AND is on a PR (not a plain issue)
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Frontend Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-haiku-4-5
          custom_instructions: |
            Read AGENTS.md at the repo root. All review rules are inline there — do not read any other files.
            Follow the protocol in AGENTS.md exactly: diff → identify patterns → apply matching rule sections → post ONE review comment.
            Never post a task list or status update. Post findings directly in the format specified in AGENTS.md Step 3.
