name: Claude Frontend PR Review
on:
  # ONLY triggers when someone comments @claude — no auto-fire on every push
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  frontend-review:
    runs-on: ubuntu-latest
    # Guard: only run if comment contains @claude AND is on a PR (not a plain issue)
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Frontend Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-haiku-4-5
          custom_instructions: |
            Read AGENTS.md at the repo root first. It contains your full instructions.
            AGENTS.md will direct you to read two skill files before reviewing.
            You MUST follow the steps in AGENTS.md exactly — especially the mandatory
            first step of reading both skill files before touching the diff.
