name: Claude Frontend PR Review
on:
  # ONLY triggers when someone comments @claude — no auto-fire on every push
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  frontend-review:
    runs-on: ubuntu-latest
    # Guard: only run if comment contains @claude AND is on a PR (not a plain issue)
    if: |
      contains(github.event.comment.body, '@claude') &&
      (github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Overlay .github and AGENTS.md from main
        # PR branch may not have latest .github/review-skills or AGENTS.md — always pull from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/review-skills AGENTS.md

      - name: Run Claude Frontend Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-haiku-4-5
          custom_instructions: |
            Read AGENTS.md at the repo root. Follow its protocol exactly.

            Key constraint: DO NOT read .github/review-skills/ files in full.
            Use grep to fetch only rule sections relevant to patterns found in the diff.
            The grep lookup table is defined in AGENTS.md Step 2.

            Workflow: diff first → identify patterns → grep only relevant rules → post ONE review comment.
            Never post a task list or status update. Post findings directly.
